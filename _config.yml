# Site settings
title: Your Name
email: you@example.com
description: >-
  A technical blog. Write markdown in Obsidian, push, done.
baseurl: "" # the subpath of your site, e.g. /blog (leave empty for user site)
url: "" # e.g. https://username.github.io
author: Your Name
twitter_username:
github_username:

# Build settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude these from Jekyll (Obsidian noise)
exclude:
  - .obsidian
  - templates
  - README.md
  - Gemfile
  - Gemfile.lock
  - .github

# Default front matter for posts
defaults:
  - scope:
      path: "_posts"
    values:
      layout: post
