<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} &middot; {% endif %}{{ site.title }}</title>
  {% seo %}
  <link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/syntax.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav>
        <a href="{{ '/' | relative_url }}">Home</a>
      </nav>
    </div>
  </header>

  {% if page.layout == 'post' %}
  <div class="page-shell">
    <main>
      {{ content }}
    </main>
    <aside id="outline" class="outline" aria-label="Table of contents">
      <div class="outline-header">Contents</div>
      <nav id="toc-nav"></nav>
    </aside>
  </div>
  {% else %}
  <main class="wrap">
    {{ content }}
  </main>
  {% endif %}

  <footer class="site-footer">
    <div class="wrap">
      <span class="copyright">&copy; {{ site.time | date: '%Y' }} {{ site.author }}</span>
      <div class="socials">
        <a href="https://www.linkedin.com/in/lorenzo-feroleto-b51808198/" aria-label="LinkedIn" rel="me">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 1 1 0-4.125 2.062 2.062 0 0 1 0 4.125zM7.119 20.452H3.554V9h3.565v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z"/></svg>
        </a>
        <a href="https://x.com/thedevbirb" aria-label="X (Twitter)" rel="me">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        </a>
        <a href="https://github.com/thedevbirb" aria-label="GitHub" rel="me">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
        </a>
      </div>
    </div>
  </footer>

  <script>
    (function () {
      var headings = document.querySelectorAll('.post-content h2, .post-content h3, .post-content h4');

      headings.forEach(function (h) {
        if (!h.id) return;
        h.style.cursor = 'pointer';
        h.addEventListener('click', function () {
          history.replaceState(null, '', '#' + h.id);
        });
      });

      var outline = document.getElementById('outline');
      var nav = document.getElementById('toc-nav');
      if (!outline || !nav) return;

      var list = document.createElement('ul');
      headings.forEach(function (h) {
        if (!h.id) return;
        var level = parseInt(h.tagName.charAt(1), 10);
        if (level > 4) return;
        var li = document.createElement('li');
        li.className = 'toc-level-' + level;
        var a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent;
        li.appendChild(a);
        list.appendChild(li);
      });

      if (!list.children.length) {
        outline.style.display = 'none';
        return;
      }
      nav.appendChild(list);

      var spy = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          var link = nav.querySelector('a[href="#' + entry.target.id + '"]');
          if (!link) return;
          var active = nav.querySelector('a.active');
          if (active) active.classList.remove('active');
          link.classList.add('active');
        });
      }, { rootMargin: '0px 0px -70% 0px', threshold: 0 });

      headings.forEach(function (h) {
        if (h.id) spy.observe(h);
      });
    })();
  </script>
</body>
</html>
